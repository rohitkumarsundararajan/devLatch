name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: scanner dependencies (impact and fix tests need them)
        run: npm ci
        working-directory: scanner
      - name: gofmt
        run: make fmt-check
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test (race + coverage)
        run: go test -race -cover ./...

  cross-platform:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scanner/package-lock.json
      - name: scanner dependencies
        run: npm ci
        working-directory: scanner
      - name: test
        run: go test -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.1.6

  demo-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/demo-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/demo-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  dashboard-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: typecheck and build the dashboard
        run: npm run build

  dashboard-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            scanner/package-lock.json
            web/package-lock.json
      - name: scanner dependencies
        run: npm ci
        working-directory: scanner
      - name: dashboard dependencies
        run: npm ci
        working-directory: web
      - name: install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: browser test (live drift in the dashboard)
        run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-screenshot
          path: web/e2e/out/
          if-no-files-found: ignore